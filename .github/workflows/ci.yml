name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test

  win-smoke:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Ensure Windows icon
        run: npm run desktop:win:icon
      - name: Unpack smoke (no installer)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --dir --config.win.signAndEditExecutable=false
      - name: Verify unpacked binary
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-win\win-unpacked -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Unpacked Weibo Reader.exe missing" }
          Write-Host "OK $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
